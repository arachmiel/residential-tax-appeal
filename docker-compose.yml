# Local development database only. Production should use a managed Postgres that is NOT exposed to the public internet.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rta
      POSTGRES_PASSWORD: rta_dev_only
      POSTGRES_DB: rta
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
